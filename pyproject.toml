[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vasp-deb"
dynamic = ["version"]
description = "Build private Debian packages from a local VASP distribution"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RASP contributors" }]
keywords = ["vasp", "debian", "packaging", "hpc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Software Distribution",
]
dependencies = []

[project.scripts]
vasp-deb = "vasp_deb.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2", "hatchling>=1.27", "pre-commit>=4", "ruff>=0.11"]
docs = ["mkdocs>=1.6,<2"]

[tool.hatch.version]
path = "src/vasp_deb/_version.py"

[tool.hatch.build]
directory = "python-dist"
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.deb",
  "**/*.log",
  "**/*.tgz",
  "**/*.tar.gz",
  "**/*.tar.xz",
  "**/POTCAR*",
  "**/.venv/**",
  "**/.work/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vasp_deb"]

[tool.hatch.build.targets.sdist]
only-include = ["src/vasp_deb", "tests", "examples", "docs", "mkdocs.yml", "pyproject.toml", "README.md", "LICENSE", ".gitignore", ".pre-commit-config.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
